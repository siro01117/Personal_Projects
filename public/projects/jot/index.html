<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16171b">
<title>잡기장</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script>
/* 첫 페인트 전에 테마 확정. 포털과 같은 키(rakan.theme)를 써서 사이트 전체가 한 테마로 움직인다. */
try{var t=localStorage.getItem('rakan.theme');
if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}
document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='dark'}
</script>
<style>
/* ===========================================================================
   잡기장 — 폰에서 한 손으로 쓰는 캡처 보드.
   모바일: 구역 하나씩 보고, 입력창은 엄지가 닿는 화면 아래에 고정.
   데스크톱: 4구역을 한 화면에 펼친 보드.
   포털(app/globals.css)과 같은 토큰·굵기를 쓴다 — 얇은 글씨 금지, 본문 16px.
   =========================================================================== */
:root,:root[data-theme='light']{
  --bg:#f5f5f3; --panel:#ffffff; --panel2:#eeeeec;
  --fg:#191b20; --mut:#5a5e69; --faint:#8b8f9a;
  --line:rgba(20,22,28,.11); --line2:rgba(20,22,28,.2);
  --on-acc:#ffffff; --tint:12%;
  --acc:#2f6fe0; --ok:#0f8a5f; --bad:#c0392f;
}
:root[data-theme='dark']{
  --bg:#16171b; --panel:#1e1f25; --panel2:#262832;
  --fg:#eceef2; --mut:#a3a6b0; --faint:#7a7d88;
  --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.2);
  --on-acc:#16171b; --tint:22%;
  --acc:#6c9bff; --ok:#3fd39b; --bad:#ff8f85;
}
:root{
  --sans:'Pretendard','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --padx:max(16px,env(safe-area-inset-left));
  --zone:var(--acc);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  font-weight:500;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button,input{font-family:inherit;font-weight:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;
  stroke-linejoin:round;flex:0 0 auto}

/* ===== 상단 바 ===== */
.bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding-top:env(safe-area-inset-top);
  padding-left:var(--padx);padding-right:max(16px,env(safe-area-inset-right));
  height:calc(56px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.iconbtn{width:44px;height:44px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;color:var(--mut)}
.iconbtn:hover{background:var(--panel2);color:var(--fg)}
.iconbtn:active{transform:scale(.94)}
.title{font-size:18px;font-weight:800;letter-spacing:-.02em}
.spacer{margin-left:auto}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--faint);padding:0 4px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.ok .dot{background:var(--ok)}
.sync .lbl{display:none}
@media(min-width:560px){.sync .lbl{display:inline}}

/* ===== 구역 탭 — 엄지로 바꾸는 곳 ===== */
.tabs{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding:10px var(--padx);background:var(--panel);border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 15px;
  border-radius:11px;background:var(--panel2);color:var(--mut);font-size:14.5px;font-weight:700;
  letter-spacing:-.01em;transition:background .15s,color .15s}
.tab.on{background:var(--tc,var(--acc));color:var(--on-acc)}
.tab .cnt{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;opacity:.85}

/* ===== 본문 ===== */
.stage{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 var(--padx) calc(112px + env(safe-area-inset-bottom))}
.stage.board{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
@media(min-width:900px){
  .stage.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
}
.zone{padding-top:18px}
.zhead{display:flex;align-items:center;gap:9px;padding-bottom:10px;flex-wrap:wrap}
.zrail{width:4px;height:20px;border-radius:3px;background:var(--zone)}
.ztitle{font-size:17px;font-weight:800;letter-spacing:-.02em}
.zkr{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--faint)}
.zbadge{min-width:26px;height:24px;padding:0 8px;display:inline-grid;place-items:center;border-radius:999px;
  font-size:12.5px;font-weight:800;color:var(--zone);background:color-mix(in srgb,var(--zone) var(--tint),transparent);
  font-variant-numeric:tabular-nums}
.zbtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;
  border-radius:10px;border:1px solid var(--line2);color:var(--mut);font-size:13px;font-weight:700}
.zbtn:active{transform:scale(.97)}
.zbtn.on{color:var(--zone);border-color:var(--zone)}
.zbtn .ic{width:15px;height:15px}

.list{display:flex;flex-direction:column;gap:6px}
.empty{padding:18px 2px;color:var(--faint);font-size:14.5px;font-weight:600}
.item{display:flex;align-items:flex-start;gap:11px;padding:13px 12px;border-radius:13px;
  background:var(--panel);border:1px solid var(--line)}
.item.dragging{opacity:.45}
.item.over-top{box-shadow:inset 0 3px 0 var(--zone)}
.list.over-end::after{content:'';display:block;height:3px;border-radius:3px;background:var(--zone);margin:2px 6px}
.check{flex:0 0 auto;width:26px;height:26px;border-radius:9px;border:2px solid var(--line2);
  display:inline-grid;place-items:center;color:transparent;transition:.14s}
.check .ic{width:15px;height:15px;stroke-width:3}
.item.done .check{background:var(--zone);border-color:var(--zone);color:var(--on-acc)}
.text{flex:1;min-width:0;font-size:16px;font-weight:600;line-height:1.5;word-break:break-word;
  padding:2px 0;border-radius:6px;letter-spacing:-.01em}
.item.done .text{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1.5px}
.text[contenteditable='true']{outline:none;box-shadow:inset 0 -2px 0 var(--zone);cursor:text}
.srctag{flex:0 0 auto;align-self:center;font-family:var(--mono);font-size:10.5px;font-weight:700;
  color:var(--faint);border:1px solid var(--line2);border-radius:6px;padding:2px 6px}
.del{flex:0 0 auto;width:34px;height:34px;border-radius:10px;color:var(--faint);display:inline-grid;place-items:center}
.del .ic{width:17px;height:17px}
.del:active{transform:scale(.94);color:var(--bad)}
.grip{display:none}
@media(hover:hover) and (pointer:fine){          /* 마우스에서만 잡아끌기 손잡이를 보여준다 */
  .grip{display:inline-grid;place-items:center;width:16px;align-self:center;color:var(--faint);opacity:0;cursor:grab}
  .item:hover .grip{opacity:.7}
  .grip .ic{width:16px;height:16px}
  .item:hover{border-color:var(--line2)}
}

/* 가져오기 목록 */
.picker{margin:10px 0 4px;border:1px solid var(--line2);border-radius:13px;background:var(--panel);overflow:hidden}
.pk-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;
  font-size:13px;font-weight:700;color:var(--mut);border-bottom:1px solid var(--line)}
.pk-body{max-height:46vh;overflow-y:auto;padding:6px}
.pk-group{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--faint);padding:9px 9px 5px}
.pk-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:46px;padding:9px 10px;
  border-radius:10px;font-size:15px;font-weight:600;color:var(--fg)}
.pk-item:active{background:var(--panel2)}
.pk-item .ic{width:17px;height:17px;color:var(--acc)}
.pk-empty{padding:14px;font-size:14px;color:var(--faint);font-weight:600}

/* ===== 입력 — 모바일은 화면 아래 고정(엄지), 데스크톱 보드는 각 구역 안 ===== */
.composer{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;gap:9px;
  padding:12px var(--padx) calc(12px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line)}
.composer.inline{position:static;padding:0 0 12px;background:none;backdrop-filter:none;border-top:none}
.composer input{flex:1;min-width:0;height:50px;padding:0 15px;border-radius:13px;background:var(--panel);
  border:1.5px solid var(--line2);font-size:16px;font-weight:600;outline:none}
.composer.inline input{height:46px}
.composer input::placeholder{color:var(--faint);font-weight:500}
.composer input:focus{border-color:var(--zone)}
.addbtn{flex:0 0 auto;width:50px;height:50px;border-radius:13px;background:var(--zone);color:var(--on-acc);
  display:inline-grid;place-items:center}
.composer.inline .addbtn{width:46px;height:46px}
.addbtn:active{transform:scale(.95)}
.addbtn .ic{width:22px;height:22px;stroke-width:2.6}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  background:var(--fg);color:var(--bg);font-size:14px;font-weight:700;padding:11px 18px;border-radius:12px;
  opacity:0;pointer-events:none;transition:.24s var(--ease);z-index:30}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.001ms!important}}
</style>
</head>
<body>
<header class="bar">
  <a class="iconbtn" href="/" aria-label="포털로 돌아가기">
    <svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <span class="title">잡기장</span>
  <span class="spacer"></span>
  <span class="sync off" id="sync"><span class="dot"></span><span class="lbl" id="syncl">로컬</span></span>
  <button class="iconbtn" id="tg" aria-label="화면 밝기 바꾸기"></button>
</header>

<nav class="tabs" id="tabs" aria-label="구역 선택"></nav>
<main class="stage" id="stage"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const SUPA='https://ovnabmmofgujgefuamzn.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92bmFibW1vZmd1amdlZnVhbXpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NzY1NDMsImV4cCI6MjA5MDU1MjU0M30.IvgT7eE_PfxRplHVkf2kXGw_sqGy07WNausqit3qskk';
const KV='jot';
function rpc(fn,body){return fetch(SUPA+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}

/* 구역마다 색을 준다 — 어느 구역을 보고 있는지 색으로 먼저 알아채게. */
const ZONES=[
  {key:'NOW', kr:'지금',     c:'#e0803a', ph:'지금 할 일'},
  {key:'WORK',kr:'일',       c:'#2f6fe0', ph:'업무 할 일'},
  {key:'TODO',kr:'일상',     c:'#1f9c8c', ph:'일상 할 일'},
  {key:'IDEA',kr:'아이디어', c:'#8b6cf0', ph:'떠오른 생각'}
];
const KEYS=ZONES.map(function(z){return z.key;});
const THEME_KEY='rakan.theme';
const LKEY='jot_v1';

function blank(){return {items:{IDEA:[],WORK:[],NOW:[],TODO:[]},view:'NOW'};}
function normalize(s){
  var o=blank(); if(!s||typeof s!=='object')return o;
  o.view=(s.view==='all'||KEYS.indexOf(s.view)>=0)?s.view:'NOW';
  var it=s.items||{};
  KEYS.forEach(function(k){
    o.items[k]=Array.isArray(it[k])?it[k].filter(function(x){
      if(!x||!x.id)return false;
      if(x.ref)return k==='NOW'&&x.ref.k&&x.ref.id;
      return typeof x.text==='string';
    }):[];
  });
  return o;
}
var state=normalize(function(){try{return JSON.parse(localStorage.getItem(LKEY));}catch(e){return null;}}());

var uidC=0;
function uid(){uidC++;return 'i'+Date.now().toString(36)+'-'+uidC;}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function IC(n){var p={
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="M4 12l5 5L20 6"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  trash:'<path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M7 7l1 13h8l1-13"/>',
  grip:'<path d="M8 7h8M8 12h8M8 17h8"/>',
  unlink:'<path d="M9.5 14.5l5-5"/><path d="M8.5 11.5l-2 2a2.8 2.8 0 0 0 4 4l2-2"/><path d="M15.5 12.5l2-2a2.8 2.8 0 0 0-4-4l-2 2"/>',
  sun:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>',
  moon:'<path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>'
}[n]||''; return '<svg class="ic" viewBox="0 0 24 24">'+p+'</svg>';}

var toastT=null;
function toast(m){var el=document.getElementById('toast');el.textContent=m;el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show');},1800);}

/* ---- 저장 ---- */
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(state));}catch(e){}}
var saveT=null, touched=false;
function setSync(ok){var el=document.getElementById('sync');el.className='sync '+(ok?'ok':'off');
  document.getElementById('syncl').textContent=ok?'동기화됨':'로컬';}
function persist(){
  touched=true; saveLocal(); clearTimeout(saveT);
  saveT=setTimeout(function(){ rpc('kv_set',{p_k:KV,p_v:state}).then(function(r){ if(r!==null)setSync(true); }); },500);
}
function loadRemote(){
  return rpc('kv_get',{p_k:KV}).then(function(r){
    if(touched){ if(r!==null)setSync(true); return; }   /* 편집을 시작했으면 로컬 우선 — 원격이 덮지 않음 */
    if(r&&typeof r==='object'&&r.items){ state=normalize(r); saveLocal(); setSync(true); render(); }
    else if(r!==null){ setSync(true); }
  });
}

/* ---- 테마 (포털과 공용 키) ---- */
function theme(){return document.documentElement.dataset.theme==='light'?'light':'dark';}
function paintThemeBtn(){ document.getElementById('tg').innerHTML=IC(theme()==='dark'?'sun':'moon'); }
function toggleTheme(){
  var next=theme()==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next;
  try{localStorage.setItem(THEME_KEY,next);}catch(e){}
  paintThemeBtn();
}

/* ---- 조작 ---- */
var nowPicker=false;
function zoneOf(k){return ZONES.find(function(z){return z.key===k;});}
function findItem(k,id){var a=state.items[k]||[];for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function nowSrc(e){return e.ref?findItem(e.ref.k,e.ref.id):null;}
function isDone(k,x){ if(x.ref){var s=nowSrc(x);return s?!!s.done:true;} return !!x.done; }
function countRemain(k){var a=state.items[k]||[],n=0;
  for(var i=0;i<a.length;i++){if(a[i].ref&&!nowSrc(a[i]))continue;if(!isDone(k,a[i]))n++;}return n;}
function pruneNow(){var b=state.items.NOW.length;
  state.items.NOW=state.items.NOW.filter(function(e){return !e.ref||!!nowSrc(e);});
  return state.items.NOW.length!==b;}
function add(k,text){text=(text||'').trim(); if(!text)return false;
  state.items[k].unshift({id:uid(),text:text,done:false}); persist(); return true;}
function linkItem(srcK,srcId){
  if(srcK==='NOW'||!findItem(srcK,srcId))return;
  if(state.items.NOW.some(function(e){return e.ref&&e.ref.k===srcK&&e.ref.id===srcId;}))return;
  state.items.NOW.unshift({id:uid(),ref:{k:srcK,id:srcId}}); persist();
}
function toggle(k,id){var e=findItem(k,id);if(!e)return;
  if(e.ref){var s=nowSrc(e);if(s)s.done=!s.done;}else e.done=!e.done; persist();}
function del(k,id){state.items[k]=state.items[k].filter(function(x){return x.id!==id;}); persist();}
function editText(k,id,text){var e=findItem(k,id);if(e&&!e.ref){
  if(text.trim())e.text=text.trim();
  else state.items[k]=state.items[k].filter(function(x){return x.id!==id;});} persist();}
function clearDone(k){
  var before=(state.items[k]||[]).length;
  state.items[k]=(state.items[k]||[]).filter(function(x){return !isDone(k,x);});
  var n=before-state.items[k].length;
  if(n){persist();render();toast(n+'개 지웠어요');}else toast('지울 완료 항목이 없어요');
}

/* ---- 그리기 ---- */
function rowHTML(k,id,text,done,srcZone){
  var link=!!srcZone;
  return '<div class="item'+(done?' done':'')+(link?' link':'')+'" data-id="'+id+'" data-k="'+k+'" draggable="true">'
    +'<span class="grip" aria-hidden="true">'+IC('grip')+'</span>'
    +'<button class="check" data-check aria-label="'+(done?'완료 취소':'완료')+'">'+IC('check')+'</button>'
    +'<span class="text"'+(link?'':' data-text tabindex="0" role="button" aria-label="눌러서 수정"')+'>'+esc(text)+'</span>'
    +(link?'<span class="srctag">'+srcZone+'</span>':'')
    +'<button class="del" data-del aria-label="'+(link?'연동 해제':'삭제')+'">'+IC(link?'unlink':'x')+'</button></div>';
}
function listHTML(z){
  var items=state.items[z.key]||[];
  if(!items.length)return '<div class="empty">아직 없어요. 아래에 적어 보세요.</div>';
  if(z.key==='NOW'){
    return items.map(function(e){
      if(e.ref){var s=nowSrc(e); if(!s)return ''; return rowHTML('NOW',e.id,s.text,s.done,e.ref.k);}
      return rowHTML('NOW',e.id,e.text,e.done,null);
    }).join('');
  }
  return items.map(function(it){return rowHTML(z.key,it.id,it.text,it.done,null);}).join('');
}
function pickerHTML(){
  var G=['WORK','TODO','IDEA'], linked={};
  state.items.NOW.forEach(function(e){if(e.ref)linked[e.ref.k+'|'+e.ref.id]=1;});
  var rows='';
  G.forEach(function(gk){
    var av=(state.items[gk]||[]).filter(function(it){return !linked[gk+'|'+it.id]&&!it.done;});
    if(!av.length)return;
    rows+='<div class="pk-group">'+gk+' · '+zoneOf(gk).kr+'</div>'+av.map(function(it){
      return '<button class="pk-item" data-link="'+gk+'|'+it.id+'">'+IC('plus')+esc(it.text)+'</button>';
    }).join('');
  });
  if(!rows)rows='<div class="pk-empty">가져올 항목이 없어요. 일·일상·아이디어에 먼저 추가하세요.</div>';
  return '<div class="picker"><div class="pk-head">다른 구역에서 가져오기'
    +'<button class="iconbtn" data-pullclose aria-label="닫기">'+IC('x')+'</button></div>'
    +'<div class="pk-body">'+rows+'</div></div>';
}
function composerHTML(z,inline){
  return '<div class="composer'+(inline?' inline':'')+'" style="--zone:'+z.c+'">'
    +'<input data-add="'+z.key+'" placeholder="'+z.ph+' 적고 Enter" enterkeyhint="done" '
    +'autocomplete="off" aria-label="'+z.kr+' 항목 추가">'
    +'<button class="addbtn" data-addbtn="'+z.key+'" aria-label="추가">'+IC('plus')+'</button></div>';
}
function zoneHTML(z,inline){
  var btn=z.key==='NOW'
    ? '<button class="zbtn'+(nowPicker?' on':'')+'" data-pull>'+IC('plus')+' 가져오기</button>'
    : '<button class="zbtn" data-cleardone="'+z.key+'">'+IC('trash')+' 완료 정리</button>';
  return '<section class="zone" data-zone="'+z.key+'" style="--zone:'+z.c+'">'
    +'<div class="zhead"><span class="zrail"></span><span class="ztitle">'+z.kr+'</span>'
    +'<span class="zkr">'+z.key+'</span><span class="zbadge">'+countRemain(z.key)+'</span>'
    +btn+'</div>'
    +(z.key==='NOW'&&nowPicker?pickerHTML():'')
    +(inline?composerHTML(z,true):'')
    +'<div class="list" data-list="'+z.key+'">'+listHTML(z)+'</div></section>';
}

var stage=document.getElementById('stage');
function renderTabs(){
  var t=ZONES.concat([{key:'all',kr:'전체',c:'#7a7d88'}]);
  document.getElementById('tabs').innerHTML=t.map(function(z){
    var on=state.view===z.key;
    var cnt=z.key==='all'?'':'<span class="cnt">'+countRemain(z.key)+'</span>';
    return '<button class="tab'+(on?' on':'')+'" data-tab="'+z.key+'" style="--tc:'+z.c+'"'
      +(on?' aria-current="true"':'')+'>'+z.kr+cnt+'</button>';
  }).join('');
}
function render(){
  if(pruneNow())saveLocal();
  paintThemeBtn();
  renderTabs();
  var old=document.querySelector('.composer:not(.inline)');
  if(old)old.remove();
  if(state.view==='all'){
    stage.className='stage board';
    stage.innerHTML=ZONES.map(function(z){return zoneHTML(z,true);}).join('');
  }else{
    var z=zoneOf(state.view);
    stage.className='stage';
    stage.innerHTML=zoneHTML(z,false);
    document.body.insertAdjacentHTML('beforeend',composerHTML(z,false));   /* 화면 아래 고정 입력창 */
  }
}

/* ---- 이벤트 ---- */
document.getElementById('tg').addEventListener('click',toggleTheme);
document.getElementById('tabs').addEventListener('click',function(e){
  var b=e.target.closest('[data-tab]'); if(!b)return;
  state.view=b.getAttribute('data-tab'); nowPicker=false; saveLocal(); render(); stage.scrollTop=0;
});

function addFrom(k){
  var inp=document.querySelector('input[data-add="'+k+'"]'); if(!inp)return;
  var v=inp.value; inp.value='';
  if(add(k,v)){ render(); var ni=document.querySelector('input[data-add="'+k+'"]'); if(ni)ni.focus(); }
}
document.addEventListener('click',function(e){
  var addb=e.target.closest('[data-addbtn]');
  if(addb){ addFrom(addb.getAttribute('data-addbtn')); return; }
  var cd=e.target.closest('[data-cleardone]'); if(cd){ clearDone(cd.getAttribute('data-cleardone')); return; }
  var pull=e.target.closest('[data-pull]'); if(pull){ nowPicker=!nowPicker; render(); return; }
  var pc=e.target.closest('[data-pullclose]'); if(pc){ nowPicker=false; render(); return; }
  var lnk=e.target.closest('[data-link]');
  if(lnk){ var pr=lnk.getAttribute('data-link').split('|'); linkItem(pr[0],pr[1]); nowPicker=false; render(); toast('지금으로 가져왔어요'); return; }
  var it=e.target.closest('.item'); if(!it)return;
  var k=it.getAttribute('data-k'), id=it.getAttribute('data-id');
  if(e.target.closest('[data-check]')){ toggle(k,id); render(); return; }
  if(e.target.closest('[data-del]')){ del(k,id); render(); return; }
  /* 글자를 한 번 누르면 바로 수정 — 폰에서는 더블클릭을 쓸 수 없다 */
  var tx=e.target.closest('[data-text]');
  if(tx&&tx.getAttribute('contenteditable')!=='true'){
    it.setAttribute('draggable','false');
    tx.setAttribute('contenteditable','true'); tx.focus();
    var r=document.createRange(); r.selectNodeContents(tx);
    var s=getSelection(); s.removeAllRanges(); s.addRange(r);
  }
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var inp=e.target.closest('input[data-add]');
  if(inp){ e.preventDefault(); addFrom(inp.getAttribute('data-add')); return; }
  var tx=e.target.closest('.text[contenteditable="true"]'); if(tx){ e.preventDefault(); tx.blur(); }
});
document.addEventListener('blur',function(e){
  var tx=e.target.closest&&e.target.closest('[data-text][contenteditable="true"]'); if(!tx)return;
  tx.removeAttribute('contenteditable');
  var it=tx.closest('.item');
  editText(it.getAttribute('data-k'),it.getAttribute('data-id'),tx.textContent);
  render();
},true);

/* ---- 끌어서 정렬 (마우스 전용 — 터치는 HTML5 드래그를 지원하지 않는다) ---- */
var drag=null;
function clearOver(){
  document.querySelectorAll('.over-top').forEach(function(e){e.classList.remove('over-top');});
  document.querySelectorAll('.list.over-end').forEach(function(e){e.classList.remove('over-end');});
}
function afterEl(list,y){
  var els=list.querySelectorAll('.item:not(.dragging)');
  for(var i=0;i<els.length;i++){var r=els[i].getBoundingClientRect();if(y<r.top+r.height/2)return els[i];}
  return null;
}
stage.addEventListener('dragstart',function(e){
  var it=e.target.closest('.item'); if(!it||it.getAttribute('draggable')==='false')return;
  drag={k:it.getAttribute('data-k'),id:it.getAttribute('data-id')};
  it.classList.add('dragging'); e.dataTransfer.effectAllowed='move';
  try{e.dataTransfer.setData('text/plain',drag.id);}catch(_){}
});
stage.addEventListener('dragend',function(){
  var d=document.querySelector('.item.dragging'); if(d)d.classList.remove('dragging'); clearOver(); drag=null;
});
stage.addEventListener('dragover',function(e){
  if(!drag)return; var list=e.target.closest('.list'); if(!list)return;
  if(list.getAttribute('data-list')!==drag.k)return;      /* 같은 구역 안에서만 재정렬 */
  e.preventDefault(); e.dataTransfer.dropEffect='move'; clearOver();
  var a=afterEl(list,e.clientY); if(a)a.classList.add('over-top'); else list.classList.add('over-end');
});
stage.addEventListener('drop',function(e){
  if(!drag)return; var list=e.target.closest('.list'); if(!list){clearOver();drag=null;return;}
  e.preventDefault();
  var destK=list.getAttribute('data-list'), a=afterEl(list,e.clientY);
  var beforeId=a?a.getAttribute('data-id'):null;
  var src=state.items[drag.k], idx=-1;
  for(var i=0;i<src.length;i++)if(src[i].id===drag.id){idx=i;break;}
  if(idx>=0){
    var moved=src.splice(idx,1)[0], dest=state.items[destK];
    if(beforeId){var bi=-1;for(var j=0;j<dest.length;j++)if(dest[j].id===beforeId){bi=j;break;}
      dest.splice(bi<0?dest.length:bi,0,moved);}
    else dest.push(moved);
    persist();
  }
  clearOver(); drag=null; render();
});

render();
loadRemote();
</script>
</body>
</html>
